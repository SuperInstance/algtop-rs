[package]
name = "algtop-rs"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SuperInstance/algtop-rs"
description = "Algebraic topology in Rust — simplicial homology, cohomology, Mayer-Vietoris, homotopy groups, CW complexes"

[dependencies]
serde = { version = "1", features = ["derive"] }
nalgebra = { version = "0.33", features = ["serde-serialize"] }

